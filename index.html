<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Three Deep Breaths">
<meta property="og:title" content="Three Deep Breaths.">
<meta property="og:description" content="A little retreat into yourself.">
<meta property="og:image" content="/og-image.jpg">
<title>Three Deep Breaths.</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--paper:#F5F0E6;--ink:#243128;--green:#294632;--muted:#818A80;--line:#C4C5B9}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:Georgia,serif;-webkit-font-smoothing:antialiased}
main{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:28px}
.brand{position:absolute;top:calc(22px + env(safe-area-inset-top));font-size:17px}
.footer{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted)}
.wrap,.screen{width:min(88vw,420px)}
.prompt{font-size:50px;line-height:1.05;margin-bottom:40px;letter-spacing:-.035em}
.orb{width:240px;height:240px;border:1px solid #9BA68D;border-radius:50%;margin:0 auto 38px;transition-property:transform,background,box-shadow;transition-timing-function:ease-in-out}
.orb.inhale{transform:scale(1.22);background:#DDE3D355;box-shadow:0 0 60px #A8B19733}
.orb.exhale{transform:scale(.92)}
.phase{height:20px;font:13px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#657062}
.timer{height:48px;font:36px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--green);font-variant-numeric:tabular-nums}
.count{height:18px;margin-bottom:12px;font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted)}
.retreat .count{height:18px;margin-bottom:12px;font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
button{cursor:pointer}
.begin{border:0;border-radius:999px;padding:14px 25px;background:var(--green);color:white;font:15px -apple-system,BlinkMacSystemFont,sans-serif}
.invite{position:absolute;width:min(88vw,420px);opacity:0;pointer-events:none;transition:opacity .7s ease}
.invite.show{opacity:1;pointer-events:auto}
.invite .message{font-size:0}
.stay{display:inline-flex;align-items:center;justify-content:center;min-width:138px;min-height:48px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.12);color:var(--green);font:15px -apple-system,BlinkMacSystemFont,sans-serif}
.subtle{font:12px -apple-system,BlinkMacSystemFont,sans-serif;color:#8A9088;margin-top:11px;letter-spacing:.025em}
.alt{border-color:transparent;color:#657062;background:transparent}
.done{display:block;margin:30px auto 0;background:none;border:0;color:#8A9088;font:12px -apple-system,BlinkMacSystemFont,sans-serif}
.retreat{position:absolute;width:min(88vw,420px);opacity:0;pointer-events:none;transition:opacity .7s ease}
.retreat.show{opacity:1;pointer-events:auto}
.retreat .orb{margin-bottom:28px}
.welcome{position:absolute;width:min(88vw,420px);opacity:0;pointer-events:none;transition:opacity .8s ease}
.welcome.show{opacity:1;pointer-events:auto}
.welcome .message{font-size:34px;letter-spacing:-.025em}
.volume{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;color:#657062;opacity:.8}
.volume input{width:82px;accent-color:var(--green);height:28px;margin:0}
.volume svg{display:block}
@media(max-height:700px){.orb{width:200px;height:200px;margin-bottom:24px}.prompt{font-size:42px;margin-bottom:24px}}
@media(prefers-reduced-motion:reduce){.orb,.invite,.retreat,.welcome{transition:none}}
</style>
</head>
<body>
<main>
<div class="brand">Three Deep Breaths.</div>

<section class="wrap" id="home">
  <div class="prompt">Pause.</div>
  <div class="orb" id="orb"></div>
  <div class="phase" id="phase">Ready</div>
  <div class="timer" id="timer"></div>
  <div class="count" id="count"></div>
  <button class="begin" id="begin">Three Deep Breaths</button>
</section>

<section class="invite" id="invite">
  <button class="stay" id="inviteButton">Stay</button>
  <div class="subtle" id="inviteSubtle">if you feel</div>
  <button class="done" id="inviteDone">I'm good</button>
</section>

<section class="retreat" id="retreat">
  <div class="orb" id="retreatOrb"></div>
  <div class="phase" id="retreatPhase"></div>
  <div class="timer" id="retreatTimer"></div>
  <div class="count" id="retreatCount"></div>
  <button class="done" id="leave">Leave whenever you're ready</button>
</section>

<section class="welcome" id="welcome">
  <div class="message">Welcome back.</div>
  <button class="stay" id="homeButton" style="margin-top:24px">Home</button>
</section>

<audio id="breathAudio" preload="auto" loop playsinline></audio>
<audio id="gongAudio" preload="auto"></audio>

<div class="volume" aria-label="Sound volume">
  <span id="speaker" aria-hidden="true">
    <svg id="speakerOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M16 9.5c1.2 1.2 1.2 3.8 0 5"></path><path d="M19 7c2.6 2.8 2.6 7.2 0 10"></path>
    </svg>
    <svg id="speakerOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
      <path d="M4 9v6h4l5 4V5L8 9H4z"></path><path d="M17 9l4 6"></path><path d="M21 9l-4 6"></path>
    </svg>
  </span>
  <input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume">
</div>
<div class="footer">No login. No tracking. Just a pause.</div>
</main>

<script>
'use strict';
const $=id=>document.getElementById(id);
const home=$('home'),invite=$('invite'),retreat=$('retreat'),welcome=$('welcome');
const orb=$('orb'),phase=$('phase'),timer=$('timer'),count=$('count');
const retreatOrb=$('retreatOrb'),retreatPhase=$('retreatPhase'),retreatTimer=$('retreatTimer'),retreatCount=$('retreatCount');
let audioCtx=null,master=null,volumeLevel=.55, nextStage=7;

function setVolume(value){
  volumeLevel=Math.max(0,Math.min(1,Number(value)/100));
  $('volume').value=Math.round(volumeLevel*100);
  $('speakerOn').style.display=volumeLevel===0?'none':'block';
  $('speakerOff').style.display=volumeLevel===0?'block':'none';
  if(master&&audioCtx){
    master.gain.cancelScheduledValues(audioCtx.currentTime);
    master.gain.setTargetAtTime(.42*volumeLevel,audioCtx.currentTime,.015);
  }
  if(typeof breathAudio!=='undefined') breathAudio.volume=volumeLevel;
  if(typeof gongAudio!=='undefined') gongAudio.volume=volumeLevel;
}
const breathAudio=$('breathAudio');
const gongAudio=$('gongAudio');
let nativeAudioReady=false;

function startAudio(){
  try{
    breathAudio.src='./breath-loop.wav';
    gongAudio.src='./gong.wav';
    breathAudio.volume=volumeLevel;
    gongAudio.volume=volumeLevel;
    nativeAudioReady=true;
    const p=breathAudio.play();
    if(p&&p.catch)p.catch(()=>{});
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata=new MediaMetadata({
          title:'Three Deep Breaths.',
          artist:'Three Deep Breaths.',
          album:'A little retreat into yourself.'
        });
        navigator.mediaSession.setActionHandler('play',()=>breathAudio.play().catch(()=>{}));
        navigator.mediaSession.setActionHandler('pause',()=>breathAudio.pause());
      }catch(e){}
    }
  }catch(e){}
}

function stopBreathAudio(){
  try{breathAudio.pause();breathAudio.currentTime=0;}catch(e){}
}

function breathSound(kind,seconds){
  return;
}

function completionSound(){
  try{
    gongAudio.volume=volumeLevel;
    gongAudio.currentTime=0;
    const p=gongAudio.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}

let activeSession=null;

function updateBreathingUI(session, nowMs){
  if(!activeSession || activeSession!==session) return false;

  const elapsed=Math.max(0, nowMs-session.startMs);
  const total=session.breaths*10000;

  if(elapsed>=total){
    session.finished=true;
    return true;
  }

  const breathIndex=Math.floor(elapsed/10000)+1;
  const within=elapsed%10000;
  const inhale=within<4000;
  const phaseElapsed=inhale?within:within-4000;
  const phaseDuration=inhale?4000:6000;
  const phaseSeconds=Math.max(0,Math.ceil((phaseDuration-phaseElapsed)/1000));

  session.countEl.textContent='Breath '+breathIndex+' of '+session.breaths;
  session.phaseEl.textContent=inhale?'Inhale':'Exhale';
  session.timerEl.textContent=String(phaseSeconds);

  const progress=phaseElapsed/phaseDuration;
  session.orbEl.className='orb '+(inhale?'inhale':'exhale');
  session.orbEl.style.transitionDuration='0.08s';
  session.orbEl.style.transform=inhale
    ? 'scale('+(1.0+0.22*progress)+')'
    : 'scale('+(1.22-0.30*progress)+')';

  return false;
}

function syncAudioToSession(session){
  if(!session || typeof breathAudio==='undefined' || !breathAudio.src) return;
  const elapsed=Math.max(0,Date.now()-session.startMs);
  const position=(elapsed%10000)/1000;
  try{
    if(Math.abs(breathAudio.currentTime-position)>0.18){
      breathAudio.currentTime=position;
    }
    breathAudio.volume=volumeLevel;
    const p=breathAudio.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}

function runElapsedSession(breaths, orbEl, phaseEl, timerEl, countEl){
  return new Promise(resolve=>{
    const session={
      breaths,
      startMs:Date.now(),
      orbEl,phaseEl,timerEl,countEl,
      finished:false,
      resolve
    };
    syncAudioToSession(session);
    activeSession=session;

    function tick(){
      if(!activeSession || activeSession!==session) return;

      const done=updateBreathingUI(session,Date.now());

      if(done){
        session.orbEl.style.transform='scale(1)';
        session.timerEl.textContent='';
        session.phaseEl.textContent='';
        activeSession=null;
        resolve();
        return;
      }

      requestAnimationFrame(tick);
    }

    tick();
  });
}

function syncActiveSession(){
  if(activeSession) updateBreathingUI(activeSession,Date.now());
}

async function runThree(){
  startAudio();
  $('begin').style.display='none';
  $('begin').disabled=true;

  await runElapsedSession(3,orb,phase,timer,count);

  await new Promise(r=>setTimeout(r,900));
  stopBreathAudio();
  completionSound();

  home.style.opacity='0';
  home.style.pointerEvents='none';
  nextStage=7;
  showInvite('Stay','if you feel');
}

function showInvite(label,sub){
  $('inviteButton').textContent=label;
  $('inviteSubtle').textContent=sub||'';
  invite.classList.add('show');
}
async function runRetreatStage(breaths){
  invite.classList.remove('show');
  retreat.classList.add('show');
  retreatCount.style.visibility='visible';
  startAudio();

  await runElapsedSession(
    breaths,
    retreatOrb,
    retreatPhase,
    retreatTimer,
    retreatCount
  );

  await new Promise(r=>setTimeout(r,900));
  stopBreathAudio();
  completionSound();
  retreat.classList.remove('show');

  if(breaths===21){
    welcome.classList.add('show');
    return;
  }

  if(breaths===7){
    nextStage=12;
    showInvite('A little more','');
  }else{
    nextStage=21;
    showInvite('A while longer','');
  }
}

$('begin').addEventListener('click',runThree);
$('inviteButton').addEventListener('click',()=>runRetreatStage(nextStage));
$('inviteDone').addEventListener('click',()=>{
  invite.classList.remove('show');welcome.classList.add('show');
});
$('leave').addEventListener('click',()=>{
  retreat.classList.remove('show');welcome.classList.add('show');
});
$('homeButton').addEventListener('click',()=>{
  window.location.href='/';
});
$('volume').addEventListener('input',e=>setVolume(e.target.value));

function resumeAudioAfterReturn(){
  if(typeof breathAudio==='undefined') return;
  if(!activeSession) return;
  if(!breathAudio.src || breathAudio.paused === false) return;
  try{
    breathAudio.volume=volumeLevel;
    const p=breathAudio.play();
    if(p&&p.catch)p.catch(()=>{});
  }catch(e){}
}

document.addEventListener('visibilitychange',()=>{
  syncActiveSession();
  if(document.visibilityState==='visible'){
    resumeAudioAfterReturn();
    if(activeSession) syncAudioToSession(activeSession);
  }
});
window.addEventListener('pageshow',()=>{
  syncActiveSession();
  resumeAudioAfterReturn();
  if(activeSession) syncAudioToSession(activeSession);
});
window.addEventListener('focus',()=>{
  syncActiveSession();
  resumeAudioAfterReturn();
  if(activeSession) syncAudioToSession(activeSession);
});

setVolume($('volume').value);

setInterval(()=>{
  if(activeSession && document.visibilityState==='visible'){
    syncAudioToSession(activeSession);
  }
},500);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register(
        '/sw.js?v=20260813-v8',
        { updateViaCache: 'none' }
      );

      await registration.update();

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        window.location.reload();
      });
    } catch (error) {
      console.log('Service worker update unavailable:', error);
    }
  });
}
</script>
</body>
</html>
