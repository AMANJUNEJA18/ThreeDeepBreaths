<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Three Deep Breaths">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="Three Deep Breaths.">
<meta property="og:description" content="Pause.">
<meta property="og:image" content="https://app.threedeepbreaths.in/og-image.jpg">
<meta property="og:url" content="https://app.threedeepbreaths.in/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Three Deep Breaths.">
<meta name="twitter:description" content="Pause.">
<meta name="twitter:image" content="https://app.threedeepbreaths.in/og-image.jpg">
<title>Three Deep Breaths.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}
body{background:#F5F0E6;color:#243128;font-family:Georgia,serif}
main{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;padding:28px}
.brand{position:absolute;top:calc(22px + env(safe-area-inset-top));font-size:17px}
.footer{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:#8A9187}
.wrap{width:min(88vw,420px)}.prompt{font-size:52px;margin-bottom:42px}
.orb{width:240px;height:240px;border:1px solid #9BA68D;border-radius:50%;margin:0 auto 40px;transition-property:transform,background,box-shadow;transition-timing-function:ease-in-out}
.orb.inhale{transform:scale(1.22);background:#DDE3D355;box-shadow:0 0 60px #A8B19733}.orb.exhale{transform:scale(.92)}
.phase{height:20px;font:14px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#657062;margin-bottom:8px}
.timer{height:48px;font:36px -apple-system,BlinkMacSystemFont,sans-serif;color:#294632;font-variant-numeric:tabular-nums}
.count{height:18px;margin-bottom:12px;font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:#8A9187}
button{border:0;border-radius:999px;padding:14px 25px;background:#294632;color:white;font:15px -apple-system,BlinkMacSystemFont,sans-serif}
.volume{position:absolute;right:24px;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;color:#657062;font:12px -apple-system,BlinkMacSystemFont,sans-serif;opacity:.8}
.volume input{width:78px;accent-color:#294632;height:18px}.volume svg{display:block}
.volume span{font-size:16px}
.footer{bottom:calc(58px + env(safe-area-inset-bottom))}
.done{position:absolute;font-size:30px;opacity:0;pointer-events:none;transition:opacity .5s}.show{opacity:1;pointer-events:auto}.hidden{opacity:0;pointer-events:none}

.done,.retreat,.welcome{position:absolute;width:min(88vw,440px);opacity:0;pointer-events:none;transition:opacity .65s ease}
.show{opacity:1;pointer-events:auto}
.message{font-size:32px;line-height:1.2;letter-spacing:-.025em;margin-bottom:34px}
.subtle{font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#818A80;margin-bottom:28px}
.choices{display:flex;flex-direction:column;gap:12px;align-items:center}
.choice{border:0;border-radius:999px;padding:13px 22px;width:min(260px,76vw);background:transparent;color:#294632;border:1px solid #B9BCAF;font:15px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}.quiet-stay{border-color:transparent;color:#657062;font-size:13px;letter-spacing:.04em}.quiet-message{font-size:30px}
.choice:active{background:#EAE4D7}
.back{margin-top:26px;background:transparent;color:#818A80;border:0;font:12px -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer}
</style></head>
<body><main>
<div class="brand">Three Deep Breaths.</div>
<div class="wrap" id="home">
<div class="prompt">Pause.</div><div class="orb" id="orb" style="transition-duration:4s"></div>
<div class="phase" id="phase">Ready</div><div class="timer" id="timer"></div>
<div class="count" id="count"></div><button id="begin">Three Deep Breaths</button>
</div>
<div class="done" id="done">That's it.<br><span style="font-size:20px">Carry on.</span><br><button id="again" style="margin-top:25px">Again</button></div>

<section class="done" id="done">
  <div class="message quiet-message">You can stay.</div>
  <div class="subtle">If you wish.</div>
  <button class="choice quiet-stay" id="continueRetreat">stay</button>
  <button class="back" id="finish">I'm good</button>
</section>
<section class="retreat" id="retreat">
  <div class="message">Take your time.</div>
  <div class="orb" id="retreatOrb"></div>
  <div class="phase" id="retreatPhase"></div>
  <div class="timer" id="retreatTimer"></div>
  <div class="count" id="retreatCount"></div>
  <button class="back" id="leave">Leave whenever you're ready</button>
</section>
<section class="welcome" id="welcome">
  <div class="message">Welcome back.</div>
  <button class="choice" id="return">Done</button>
</section>

<div class="volume" aria-label="Sound volume">
  <span id="speaker" aria-hidden="true">
<svg id="speakerOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M4 9v6h4l5 4V5L8 9H4z"></path>
<path d="M16 9.5c1.2 1.2 1.2 3.8 0 5"></path>
<path d="M19 7c2.6 2.8 2.6 7.2 0 10"></path>
</svg>
<svg id="speakerOff" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none">
<path d="M4 9v6h4l5 4V5L8 9H4z"></path>
<path d="M17 9l4 6"></path><path d="M21 9l-4 6"></path>
</svg></span>
  <input id="volume" type="range" min="0" max="100" value="55" aria-label="Volume">
</div>
<div class="footer">No login. No tracking. Just a pause.</div>
</main>
<script>
const o=document.getElementById('orb'),p=document.getElementById('phase'),h=document.getElementById('home'),d=document.getElementById('done'),c=document.getElementById('count'),t=document.getElementById('timer'),b=document.getElementById('begin'),again=document.getElementById('again'),volume=document.getElementById('volume'),speakerOn=document.getElementById('speakerOn'),speakerOff=document.getElementById('speakerOff');
const wait=x=>new Promise(r=>setTimeout(r,x));
let audioCtx=null, master=null, volumeLevel=0.55;

function setVolume(value){
  volumeLevel=Math.max(0,Math.min(1,Number(value)/100));
  volume.value=Math.round(volumeLevel*100);
  const muted=volumeLevel===0;
  if(speakerOn) speakerOn.style.display=muted?'none':'block';
  if(speakerOff) speakerOff.style.display=muted?'block':'none';
  if(master && audioCtx){
    master.gain.cancelScheduledValues(audioCtx.currentTime);
    master.gain.setTargetAtTime(0.42*volumeLevel,audioCtx.currentTime,0.02);
  }
}

function startAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    audioCtx=audioCtx||new AC();
    master=master||audioCtx.createGain();
    if(!master._connected){ master.connect(audioCtx.destination); master._connected=true; }
    setVolume(volume.value);
    const r=audioCtx.resume();
    if(r&&r.catch) r.catch(()=>{});
  }catch(e){ audioCtx=null; master=null; }
}

function breathSound(label,seconds){
  if(!audioCtx||!master||volumeLevel<=0) return;
  const now=audioCtx.currentTime;
  const o1=audioCtx.createOscillator(), o2=audioCtx.createOscillator(), g=audioCtx.createGain();
  const inhale=label==='Inhale';
  const start=inhale?174:146, end=inhale?261:110;
  o1.type='sine'; o2.type='sine';
  o1.frequency.setValueAtTime(start,now);
  o1.frequency.exponentialRampToValueAtTime(end,now+seconds);
  o2.frequency.setValueAtTime(start*2,now);
  o2.frequency.exponentialRampToValueAtTime(end*2,now+seconds);
  g.gain.setValueAtTime(0.0001,now);
  g.gain.exponentialRampToValueAtTime(0.22,now+Math.min(0.8,seconds*.22));
  g.gain.setValueAtTime(0.22,now+Math.max(0.8,seconds-1));
  g.gain.exponentialRampToValueAtTime(0.0001,now+seconds);
  o1.connect(g); o2.connect(g); g.connect(master);
  o1.start(now); o2.start(now); o1.stop(now+seconds+.05); o2.stop(now+seconds+.05);
}

function completionSound(){
  if(!audioCtx||!master||volumeLevel<=0) return;
  const now=audioCtx.currentTime;
  const mix=audioCtx.createGain();
  mix.gain.setValueAtTime(0.0001,now);
  mix.gain.exponentialRampToValueAtTime(0.20,now+0.08);
  mix.gain.exponentialRampToValueAtTime(0.0001,now+3.6);
  mix.connect(master);
  [174,261,392,523].forEach((f,i)=>{
    const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
    osc.type='sine'; osc.frequency.value=f; g.gain.value=[0.5,0.28,0.14,0.06][i];
    osc.connect(g); g.connect(mix); osc.start(now); osc.stop(now+3.8);
  });
}

async function phaseTimer(label,seconds,cls){
  p.textContent=label;
  o.style.transitionDuration=seconds+'s';
  o.className='orb '+cls;
  breathSound(label,seconds);
  const end=Date.now()+seconds*1000;
  while(true){
    const remaining=Math.max(0,end-Date.now());
    const whole=Math.ceil(remaining/1000);
    t.textContent=whole>0?whole:'';
    if(remaining<=0) break;
    await wait(Math.min(100,remaining));
  }
  t.textContent='';
}

async function go(){
  b.style.display='none';
  startAudio();
  h.classList.remove('hidden');
  d.classList.remove('show');
  for(let i=1;i<=3;i++){
    c.textContent='Breath '+i+' of 3';
    await phaseTimer('Inhale',4,'inhale');
    await phaseTimer('Exhale',6,'exhale');
  }
  await wait(700);
  completionSound();
  h.classList.add('hidden');
  d.classList.add('show');
  p.textContent=''; c.textContent=''; t.textContent=''; o.className='orb';
}

b.addEventListener('click',go);
again.addEventListener('click',()=>{
  d.classList.remove('show'); h.classList.remove('hidden'); b.style.display='inline-block';
  p.textContent='Ready'; c.textContent=''; t.textContent=''; o.className='orb'; o.style.transitionDuration='4s';
});
volume.addEventListener('input',e=>setVolume(e.target.value));
volume.addEventListener('change',e=>setVolume(e.target.value));
setVolume(volume.value);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

const doneScreen=document.getElementById('done');
const retreatScreen=document.getElementById('retreat');
const welcomeScreen=document.getElementById('welcome');
const retreatOrb=document.getElementById('retreatOrb');
const retreatPhase=document.getElementById('retreatPhase');
const retreatTimer=document.getElementById('retreatTimer');
const retreatCount=document.getElementById('retreatCount');

function retreatPhaseTimer(label,seconds,cls){
  return new Promise(resolve=>{
    retreatPhase.textContent=label;
    retreatOrb.style.transitionDuration=seconds+'s';
    retreatOrb.className='orb '+cls;
    breathSound(label,seconds);
    const end=Date.now()+seconds*1000;
    const tick=()=>{
      const remaining=Math.max(0,end-Date.now());
      const whole=Math.ceil(remaining/1000);
      retreatTimer.textContent=whole>0?whole:'';
      if(remaining<=0){
        retreatTimer.textContent='';
        resolve();
        return;
      }
      setTimeout(tick,Math.min(100,remaining));
    };
    tick();
  });
}

async function runRetreatStage(breaths){
  doneScreen.classList.remove('show');
  retreatScreen.classList.add('show');
  startAudio();

  for(let i=1;i<=breaths;i++){
    retreatCount.textContent='';
    await retreatPhaseTimer('Inhale',4,'inhale');
    await retreatPhaseTimer('Exhale',6,'exhale');
  }

  await new Promise(r=>setTimeout(r,900));
  completionSound();

  if(breaths===21){
    retreatScreen.classList.remove('show');
    welcomeScreen.classList.add('show');
    return;
  }

  retreatScreen.classList.remove('show');
  doneScreen.classList.add('show');
  doneScreen.dataset.next=String(breaths===7?12:21);
}


});
document.getElementById('continueRetreat').addEventListener('click',()=>{
  const next=Number(doneScreen.dataset.next||7);
  runRetreatStage(next);
});
document.getElementById('finish').addEventListener('click',()=>{
  doneScreen.classList.remove('show');
  welcomeScreen.classList.add('show');
});
document.getElementById('leave').addEventListener('click',()=>{
  retreatScreen.classList.remove('show');
  welcomeScreen.classList.add('show');
});
document.getElementById('return').addEventListener('click',()=>{
  [doneScreen,retreatScreen,welcomeScreen].forEach(x=>x.classList.remove('show'));
  retreatPhase.textContent=''; retreatTimer.textContent=''; retreatCount.textContent=''; retreatOrb.className='orb'; doneScreen.dataset.next='7';
  const home=document.getElementById('home');
  home.style.opacity='1';
  home.style.pointerEvents='auto';
  const begin=document.getElementById('begin');
  begin.style.display='inline-block';
  document.getElementById('phase').textContent='Ready';
  document.getElementById('timer').textContent='';
  document.getElementById('count').textContent='';
  document.getElementById('orb').className='orb';
});

</script>
</body></html>
