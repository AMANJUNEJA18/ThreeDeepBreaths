<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F0E6">
<title>Patterns. — Three Deep Breaths.</title>
<style>
:root{--paper:#F5F0E6;--ink:#243128;--green:#294632;--muted:#818A80;--line:#D1D1C7}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
body{font-family:Georgia,serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer}
.page{min-height:100dvh;display:flex;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px calc(30px + env(safe-area-inset-bottom))}
.wrap{width:min(92vw,620px);padding-bottom:34px}.top{display:flex;justify-content:center;position:relative}.title{font-size:18px}.back{position:absolute;right:0;top:-5px;border:0;background:none;color:var(--muted);font:13px -apple-system,BlinkMacSystemFont,sans-serif}
.hero{padding:12vh 0 8vh;text-align:center}.hero h1{font-size:48px;line-height:1.06;font-weight:400;letter-spacing:-.04em;margin:0 0 16px}.hero p{font:14px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted);margin:0}
.chat{display:flex;flex-direction:column;gap:18px}.msg{max-width:88%;font-size:18px;line-height:1.55}.msg.you{align-self:flex-end;text-align:right}.msg.you .bubble{background:rgba(41,70,50,.075);border-radius:22px 22px 5px 22px;padding:13px 17px;display:inline-block;text-align:left}.msg.patterns{align-self:flex-start}.msg.patterns .bubble{padding:3px 4px}.msg.patterns .small{font:11px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.composer{margin-top:28px;border-top:1px solid rgba(41,70,50,.13);padding-top:20px}.composer textarea{display:block;width:100%;min-height:115px;padding:0 2px;border:0;outline:0;resize:none;background:transparent;color:var(--ink);font:18px/1.6 Georgia,serif}.composer textarea::placeholder{color:#9aa097}
.sendrow{display:flex;justify-content:flex-end;gap:10px;margin-top:12px}.send,.startover{border-radius:999px;padding:11px 20px;font:13px -apple-system,BlinkMacSystemFont,sans-serif}.send{border:0;background:var(--green);color:#fff}.startover{border:1px solid var(--line);background:transparent;color:var(--muted)}
.invite{display:none;margin:32px 0 10px;text-align:center}.invite.show{display:block}.invite p{font-size:22px;line-height:1.4;margin:0 0 16px}.invite button{border:1px solid var(--line);background:transparent;color:var(--green);border-radius:999px;padding:11px 20px;font:13px -apple-system,BlinkMacSystemFont,sans-serif}
.patterns-result{display:none;margin-top:26px;border-top:1px solid rgba(41,70,50,.12);padding-top:26px}.patterns-result.show{display:block}.result-title{text-align:center;font-size:25px;font-weight:400;margin:0 0 24px}.pattern{padding:19px 0;border-top:1px solid rgba(41,70,50,.09)}.pattern:first-of-type{border-top:0}.label{font:10px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.pattern h3{font-size:21px;font-weight:400;line-height:1.3;margin:0 0 8px}.pattern p{font:14px/1.65 -apple-system,BlinkMacSystemFont,sans-serif;color:#667066;margin:0}.soft{margin-top:23px;text-align:center;font:12px/1.6 -apple-system,BlinkMacSystemFont,sans-serif;color:var(--muted)}
.breath{display:none;text-align:center;padding:42px 0 8px}.breath.show{display:block}.ring{width:64px;height:64px;border:1px solid #9BA68D;border-radius:50%;margin:0 auto 13px;animation:breathe 8s ease-in-out infinite}.breath span{font:10px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.1em;color:#657062}@keyframes breathe{0%,100%{transform:scale(.92)}50%{transform:scale(1.08)}}
.safe{text-align:center;margin-top:52px;font:11px -apple-system,BlinkMacSystemFont,sans-serif;color:#8b9289}
@media(max-width:700px){.hero{padding-top:10vh}.hero h1{font-size:43px}.msg{max-width:94%}}
</style>
</head>
<body>
<main class="page"><div class="wrap">
<header class="top"><div class="title">Patterns.</div><button class="back" id="back">Back</button></header>
<section class="hero" id="hero"><h1>What keeps<br>showing up?</h1><p>You don't have to know what it means.<br>Just share what you notice.</p></section>
<section class="chat" id="chat"><div class="msg patterns"><div class="small">Patterns.</div><div class="bubble">I'm here. Share whatever is there.</div></div></section>
<section class="composer" id="composer"><textarea id="story" aria-label="Share anything" placeholder="I remember…"></textarea><div class="sendrow"><button class="startover" id="clear">Start over</button><button class="send" id="send">Share</button></div></section>
<section class="invite" id="invite"><p>I think something is beginning to show.</p><button id="reveal">Would you like to see?</button></section>
<section class="patterns-result" id="result" aria-live="polite"></section>
<section class="breath" id="breath"><div class="ring"></div><span>THREE DEEP BREATHS.</span></section>
<div class="safe">A little space to be.</div>
</div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),chat=$('chat'),story=$('story'),invite=$('invite'),result=$('result'),breath=$('breath');
const state={entries:[],round:0,invited:false};
const GROUPS={
return:['return','returned','returning','again','back','reach','reached','reaching','go back','went back','come back','came back','reconnect','reconnected','reconnects'],
holding:['hold','holding','held','keep','kept','couldn’t let','couldnt let','didn’t want to let','didnt want to let','hard to leave','difficult to leave','difficulty leaving','stuck','holding on'],
release:['let go','letting go','released','release','walk away','walked away','moved on','closure','closed','leave','left'],
familiarity:['familiar','known','comfort','comfortable','safe','same','similar','connection','attached','attachment'],
repetition:['always','every time','again','repeatedly','kept','keep','over and over','many times','for years','again and again'],
transition:['change','changed','shift','shifting','different','new','old','ended','end','shut down','sold','gone','disappeared','appeared'],
evaluation:['regret','guilt','self doubt','self-worth','worth','confidence','afraid','fear','anxious','overwhelmed','ashamed']};
function norm(s){return s.toLowerCase().replace(/[“”‘’]/g,"'").replace(/[^a-z0-9'\s-]/g,' ')}
function hits(text,arr){return arr.filter(x=>text.includes(x)).length}
function analysis(){const t=norm(state.entries.join(' '));const r=hits(t,GROUPS.return),h=hits(t,GROUPS.holding),rel=hits(t,GROUPS.release),fam=hits(t,GROUPS.familiarity),rep=hits(t,GROUPS.repetition),tr=hits(t,GROUPS.transition);return{r,h,rel,fam,rep,tr,groups:[r,h,rel,fam,rep,tr].filter(Boolean).length}}
function addYou(text){const d=document.createElement('div');d.className='msg you';d.innerHTML='<div class="bubble"></div>';d.querySelector('.bubble').textContent=text;chat.appendChild(d)}
function addPatterns(text){const d=document.createElement('div');d.className='msg patterns';d.innerHTML='<div class="small">Patterns.</div><div class="bubble"></div>';d.querySelector('.bubble').textContent=text;chat.appendChild(d);d.scrollIntoView({behavior:'smooth',block:'center'})}
function gentlePrompt(){const a=analysis();
 if(state.round===1)return 'You can take your time. What happened next?';
 if(state.round===2)return 'And what was that like for you?';
 if(a.r>=2&&a.h+a.rel+a.rep>=1)return 'There may be something here. What else comes to mind?';
 if(a.fam>=1&&state.round<4)return 'What did you feel drawn to in those moments?';
 if(a.tr>=2)return 'Something seems to have changed over time. Tell me about that.';
 if(state.round<4)return 'Is there another moment like this?';
 return 'Thank you. I have enough to look a little more closely now.'}
function maybeInvite(){const a=analysis();const enough=state.round>=4&&(a.groups>=3||a.r>=2||a.h>=2||a.rel>=2);if(enough&&!state.invited){state.invited=true;invite.classList.add('show');invite.scrollIntoView({behavior:'smooth',block:'center'})}}
function send(){const raw=story.value.trim();if(raw.length<2){story.focus();return}state.entries.push(raw);state.round++;addYou(raw);story.value='';addPatterns(gentlePrompt());maybeInvite();story.focus()}
function makePatterns(){const a=analysis(),out=[];
 if(a.r>=2&&(a.h+a.rel+a.rep)>=1)out.push({label:'A possibility',title:'You may be drawn back to what feels significant.',body:'Across what you shared, there are several moments of returning or reaching back. I don’t know yet what makes you return. That part belongs to you.'});
 if(a.h>=2&&a.rel>=1)out.push({label:'Something to notice',title:'Holding on and letting go seem to meet each other.',body:'There are moments of difficulty leaving, alongside moments of release or endings. Perhaps the space between them is worth noticing.'});
 if(a.fam>=2&&a.r>=1)out.push({label:'Another possibility',title:'What feels familiar may have a pull.',body:'Comfort, familiarity or what feels known appears alongside returning. I can’t say that familiarity is the reason—only that it may be worth looking at.'});
 if(a.tr>=2&&out.length)out.push({label:'Across time',title:'And something may be changing.',body:'Your story also contains movement. The way you meet this may not be the way you once did.'});
 if(!out.length)return[{label:'For now',title:'Nothing clear enough to name.',body:'There is something here, perhaps. But I don’t want to give it a name before there is enough to support one.'}];
 return out.slice(0,3)}
function reveal(){result.innerHTML='<h2 class="result-title">Something to look at.</h2>'+makePatterns().map(p=>'<article class="pattern"><div class="label">'+p.label+'</div><h3>'+p.title+'</h3><p>'+p.body+'</p></article>').join('')+'<div class="soft">Does any of this feel true?<br>You can say no. You can change it. You can leave it here.</div>';result.classList.add('show');invite.classList.add('hidden');breath.classList.add('show');result.scrollIntoView({behavior:'smooth',block:'start'})}
function reset(){state.entries=[];state.round=0;state.invited=false;chat.innerHTML='<div class="msg patterns"><div class="small">Patterns.</div><div class="bubble">I’m here. Share whatever is there.</div></div>';invite.classList.remove('show','hidden');result.classList.remove('show');breath.classList.remove('show');story.value='';story.focus()}
$('send').addEventListener('click',send);$('reveal').addEventListener('click',reveal);$('clear').addEventListener('click',reset);story.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('back').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='/'});
</script>
</body>
</html>
